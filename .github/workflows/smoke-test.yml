name: Rauchtest

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache-Version in sw.js prüfen
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="$(git merge-base HEAD origin/${{ github.base_ref }})"
          else
            BASE="${{ github.event.before }}"
          fi
          node tests/check-cache-version.cjs "$BASE"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Playwright installieren
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Spiel laden, neue Fahrt, Seeschlacht (keine JS-Fehler)
        run: node tests/smoke.cjs

      - name: Regressionstests (Kampagne, Handel, Freibeuter, Festung, 3D)
        run: node tests/regression.cjs

      - name: Bildschirmfoto hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rauchtest-bildschirmfoto
          path: tests/smoke-letzter-stand.png
          if-no-files-found: ignore
